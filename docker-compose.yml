services:
  domain-monitor:
    build: .
    image: domain-registrar-follow:latest
    container_name: domain-monitor
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/domains.db
      LOG_PATH: /app/logs/domain-monitor.log
      KILL_SWITCH_FILE: /app/data/STOP
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Tek seferlik operasyonlar icin ayni imaj:
  #   docker compose run --rm cli status
  #   docker compose run --rm cli check ornek.com
  #   docker compose run --rm cli dry-run ornek.com
  cli:
    build: .
    image: domain-registrar-follow:latest
    profiles: ["cli"]
    env_file: .env
    environment:
      DB_PATH: /app/data/domains.db
      LOG_PATH: /app/logs/domain-monitor.log
      KILL_SWITCH_FILE: /app/data/STOP
    entrypoint: ["python", "-m", "app.cli"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    init: true
